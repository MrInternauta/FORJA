name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  image:
    # Construye la imagen OCI de la API (misma que corre con Podman en local).
    # El push al registry queda como TODO: definir REGISTRY/secretos y descomentar.
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Containerfile -t forja-api:${{ github.sha }} .
      - run: docker build -f apps/web/Containerfile -t forja-web:${{ github.sha }} .
      # - name: Push & deploy
      #   run: |
      #     echo "TODO: login al registry (Fly.io/Railway/GHCR) y push + deploy"
