# Humo post-despliegue. Los despliegues los hace la integracion Git de Vercel
# (preview por PR, produccion al mergear a main); Vercel publica cada uno como
# un deployment de GitHub y este workflow lo prueba cuando queda en "success".
# Solo produccion: los previews siguen tras Vercel Authentication.
name: Smoke

on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    env:
      URL: ${{ github.event.deployment_status.environment_url }}
      ENVIRONMENT: ${{ github.event.deployment.environment }}
    steps:
      - name: API — /v1/health con base de datos
        if: endsWith(github.event.deployment.environment, 'api')
        run: |
          body=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$URL/v1/health")
          echo "$body"
          echo "$body" | jq -e '.status == "ok" and .db == true' > /dev/null

      - name: Web — login, manifest, service worker y splash
        if: endsWith(github.event.deployment.environment, 'web')
        run: |
          for path in /login /manifest.webmanifest /sw.js /splash/1170x2532; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$URL$path")
            echo "$path -> $code"
            test "$code" = 200
          done
