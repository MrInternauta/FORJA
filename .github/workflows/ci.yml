name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# El monorepo vive en forja/; GitHub solo descubre workflows en la raiz del repo.
defaults:
  run:
    working-directory: forja

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # Rutas relativas a la raiz del repo, no a working-directory.
          package_json_file: forja/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: forja/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  image:
    # Construye las imagenes OCI (las mismas que corren con Podman en local).
    # Corre tambien en PR a proposito: estaba limitada a main, asi que una rotura
    # del Containerfile solo se descubria despues de mergear (paso justo con
    # ERR_PNPM_DEPLOY_NONINJECTED_WORKSPACE). El push al registry si debe quedar
    # restringido a main: gatear ESE paso con
    # `if: github.ref == 'refs/heads/main'` al descomentarlo.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/api/Containerfile -t forja-api:${{ github.sha }} .
      - run: docker build -f apps/web/Containerfile -t forja-web:${{ github.sha }} .
      # Las imagenes solo se construyen (validan los Containerfile): el despliegue
      # lo hace la integracion Git de Vercel y el humo vive en smoke.yml.

  migrate:
    # Aplica las migraciones pendientes al Supabase de produccion al mergear a main.
    # Vercel despliega en paralelo (no espera a Actions): toda migracion debe ser
    # compatible con la API anterior (aditiva) para que el orden no importe.
    # Se activa definiendo la variable SUPABASE_PROJECT_REF y el secreto
    # SUPABASE_ACCESS_TOKEN; sin la variable el job se salta.
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - run: supabase migration list --linked
      - run: supabase db push --linked --yes
